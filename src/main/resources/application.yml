spring:
  application:
    name: roomkh-backend
  profiles:
    active: dev
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  refresh-token:
    expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS}
    session-expiration-hours: 24
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}