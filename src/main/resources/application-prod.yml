spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework: WARN
    com.roomkh.backend: INFO

app:
  cookie:
    secure: true
    same-site: Lax
  security:
    trust-proxy-headers: false

  sms:
    provider: not-configured

property-image-storage:
  provider: ${PROPERTY_IMAGE_STORAGE_PROVIDER:r2}

roomkh:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}