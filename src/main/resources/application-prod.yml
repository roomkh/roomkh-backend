spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.springframework: WARN
    com.roomkh.backend: INFO

app:
  cookie:
    secure: true
    same-site: Lax
  # trust-proxy-headers must stay false until your reverse proxy (e.g. Nginx,
  # a load balancer, or a cloud provider's edge network) is confirmed to
  # strip and re-set X-Forwarded-For itself. Enabling this before that proxy
  # is trusted lets any client fake their IP simply by sending that header.
  security:
    trust-proxy-headers: false

  sms:
    provider: not-configured