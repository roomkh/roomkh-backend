# Production profile — all secrets/hosts come from environment variables set by
# the deploy pipeline (GitHub Actions -> SSH deploy). Nothing sensitive is literal here.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:roomkh}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://roomkh.com}
  storage:
    s3:
      endpoint: ${S3_ENDPOINT}
      bucket: ${S3_BUCKET:roomkh-prod}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      region: ${S3_REGION:apac}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    tech.techey.property: WARN
