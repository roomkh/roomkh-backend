spring:
  application:
    name: property
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the single source of schema truth. Never let Hibernate generate DDL.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    owner-redirect-uri: ${GOOGLE_OWNER_REDIRECT_URI:http://localhost:3002/api/auth/google/callback}
    admin-redirect-uri: ${GOOGLE_ADMIN_REDIRECT_URI:http://localhost:3001/api/auth/google/callback}
  jwt:
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  cors:
    allowed-origins: http://localhost:3000
